<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Glimpse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --bg1: #0f0c29;
    --bg2: #302b63;
    --bg3: #24243e;
    --accent: #7c5cff;
    --accent2: #5ad1e6;
    --text: #f0f0f5;
    --muted: #9a97b5;
    --surface: rgba(255,255,255,0.06);
    --surface-border: rgba(255,255,255,0.12);
  }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg1), var(--bg2) 50%, var(--bg3));
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app { width: 100%; max-width: 480px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .brand-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 0 16px var(--accent);
  }
  h1 {
    font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin: 0;
    background: linear-gradient(135deg, #fff, var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tagline { color: var(--muted); font-size: 13px; margin: 2px 0 20px 22px; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 20px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
  }

  /* Shared screen styles */
  .screen { padding: 32px 28px; text-align: center; }
  .screen p { color: var(--muted); font-size: 14px; margin-top: 0; }
  .screen input {
    width: 100%; padding: 13px 14px; border-radius: 12px;
    border: 1px solid var(--surface-border); background: rgba(0,0,0,0.25);
    color: var(--text); font-size: 15px; font-family: inherit;
    margin: 14px 0; outline: none; transition: border-color 0.2s;
  }
  .screen input:focus { border-color: var(--accent); }
  .primary-btn {
    width: 100%; padding: 13px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, var(--accent), #9b7bff);
    color: #fff; font-weight: 700; font-size: 15px; font-family: inherit;
    cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
  }
  .primary-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,92,255,0.4); }
  .divider { color: var(--muted); font-size: 12px; margin: 18px 0; display: flex; align-items: center; gap: 10px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--surface-border); }

  #linkBox {
    display: none;
    background: rgba(0,0,0,0.3);
    border: 1px dashed var(--surface-border);
    border-radius: 12px;
    padding: 12px;
    font-size: 13px;
    color: var(--accent2);
    word-break: break-all;
    margin: 14px 0;
  }
  .copy-btn {
    margin-top: 8px;
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--surface-border);
    background: rgba(255,255,255,0.08);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }

  /* Chat screen */
  #chatScreen { display: none; }
  #status {
    font-size: 12.5px; color: var(--muted);
    display: flex; align-items: center; gap: 7px; margin: 0 0 10px 6px;
  }
  #status .dot { width: 7px; height: 7px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 8px #3ddc84; }
  #status.waiting .dot { background: #e6b800; box-shadow: 0 0 8px #e6b800; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  #messages { height: 340px; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-thumb { background: var(--surface-border); border-radius: 3px; }

  .msg-row { display: flex; flex-direction: column; max-width: 78%; animation: pop 0.2s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg-row.mine { align-self: flex-end; align-items: flex-end; }
  .msg-name { font-size: 11px; color: var(--muted); margin-bottom: 3px; padding: 0 6px; }
  .msg {
    padding: 10px 14px; background: rgba(255,255,255,0.08); border: 1px solid var(--surface-border);
    border-radius: 16px; border-bottom-left-radius: 4px; line-height: 1.45; font-size: 14.5px;
  }
  .msg-row.mine .msg {
    background: linear-gradient(135deg, var(--accent), #6a4fd9); border: none; color: #fff;
    border-bottom-left-radius: 16px; border-bottom-right-radius: 4px;
  }

  #preview { min-height: 20px; color: var(--accent2); font-style: italic; font-size: 13px; margin: 10px 2px 10px 6px; opacity: 0.9; }

  #inputBar { margin-top: 14px; padding: 10px; display: flex; gap: 8px; }
  #textInput {
    flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--surface-border);
    background: rgba(0,0,0,0.25); color: var(--text); font-size: 14.5px; font-family: inherit;
    outline: none; transition: border-color 0.2s;
  }
  #textInput:focus { border-color: var(--accent); }
  #sendBtn {
    padding: 0 20px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, var(--accent), #9b7bff); color: #fff; cursor: pointer;
    font-weight: 700; font-family: inherit; font-size: 14px; transition: transform 0.15s;
  }
  #sendBtn:hover { transform: translateY(-1px); }
</style>
</head>
<body>

<div class="app">
  <div class="brand"><span class="brand-dot"></span><h1>Glimpse</h1></div>
  <div class="tagline">See what they're typing, before they send it</div>

  <!-- Screen 1: start or join a chat -->
  <div id="startScreen" class="panel screen">
    <p>Start a new private chat, or join one with a link</p>
    <button id="createBtn" class="primary-btn">Start a new chat</button>
    <div id="linkBox"></div>
    <button id="copyBtn" class="copy-btn" style="display:none;">Copy link</button>

    <div class="divider">or</div>

    <input id="roomCodeInput" placeholder="Paste a room code or link..." autocomplete="off">
    <button id="joinRoomBtn" class="primary-btn">Join chat</button>
  </div>

  <!-- Screen 2: pick a username -->
  <div id="joinScreen" class="panel screen" style="display:none;">
    <p>Enter a name to join the chat</p>
    <input id="usernameInput" placeholder="Your name..." autocomplete="off" maxlength="20">
    <button id="joinBtn" class="primary-btn">Join chat</button>
  </div>

  <!-- Screen 3: the chat itself -->
  <div id="chatScreen">
    <div id="status" class="waiting"><span class="dot"></span><span id="statusText">Waiting for the other person to join...</span></div>
    <div id="messages" class="panel"></div>
    <div id="preview"></div>
    <div id="inputBar" class="panel">
      <input id="textInput" placeholder="Type something..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let myUsername = '';
  let myRoom = '';

  const startScreen = document.getElementById('startScreen');
  const joinScreen = document.getElementById('joinScreen');
  const chatScreen = document.getElementById('chatScreen');

  const createBtn = document.getElementById('createBtn');
  const linkBox = document.getElementById('linkBox');
  const copyBtn = document.getElementById('copyBtn');
  const roomCodeInput = document.getElementById('roomCodeInput');
  const joinRoomBtn = document.getElementById('joinRoomBtn');

  const usernameInput = document.getElementById('usernameInput');
  const joinBtn = document.getElementById('joinBtn');

  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const messagesEl = document.getElementById('messages');
  const previewEl = document.getElementById('preview');
  const inputEl = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');

  function randomRoomCode() {
    return Math.random().toString(36).substring(2, 8);
  }

  function goToUsernameScreen(room) {
    myRoom = room;
    startScreen.style.display = 'none';
    joinScreen.style.display = 'block';
    usernameInput.focus();
  }

  // "Start a new chat" — generate a room code and show the link
  createBtn.addEventListener('click', () => {
    const room = randomRoomCode();
    const link = `${window.location.origin}/?room=${room}`;
    history.replaceState(null, '', `/?room=${room}`);
    linkBox.textContent = link;
    linkBox.style.display = 'block';
    copyBtn.style.display = 'inline-block';
    createBtn.style.display = 'none';

    copyBtn.onclick = () => {
      navigator.clipboard.writeText(link);
      copyBtn.textContent = 'Copied!';
      setTimeout(() => { copyBtn.textContent = 'Copy link'; }, 1500);
    };

    setTimeout(() => goToUsernameScreen(room), 600);
  });

  // Joining by pasting a code or full link
  joinRoomBtn.addEventListener('click', () => {
    let value = roomCodeInput.value.trim();
    if (!value) return;
    // Accept either a full link or just the room code
    const match = value.match(/room=([a-zA-Z0-9]+)/);
    const room = match ? match[1] : value;
    history.replaceState(null, '', `/?room=${room}`);
    goToUsernameScreen(room);
  });

  // If the page was opened via a shared link, skip straight to username entry
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const room = params.get('room');
    if (room) goToUsernameScreen(room);
  });

  function join() {
    const name = usernameInput.value.trim();
    if (!name || !myRoom) return;
    myUsername = name;
    socket.emit('join', { room: myRoom, username: myUsername });
    joinScreen.style.display = 'none';
    chatScreen.style.display = 'block';
    inputEl.focus();
  }

  joinBtn.addEventListener('click', join);
  usernameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') join(); });

  socket.on('userList', (list) => {
    const others = list.filter(n => n !== myUsername);
    if (list.length >= 2) {
      statusEl.classList.remove('waiting');
      statusText.textContent = `Connected with ${others.join(', ') || 'someone'}`;
    } else {
      statusEl.classList.add('waiting');
      statusText.textContent = 'Waiting for the other person to join...';
    }
  });

  inputEl.addEventListener('input', () => {
    socket.emit('typing', inputEl.value);
  });

  socket.on('partnerTyping', ({ username, text }) => {
    previewEl.textContent = text ? `${username} is typing: "${text}"` : '';
  });

  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    socket.emit('sendMessage', text);
    socket.emit('typing', '');
    inputEl.value = '';
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

  socket.on('newMessage', ({ username, text }) => {
    const row = document.createElement('div');
    row.className = 'msg-row' + (username === myUsername ? ' mine' : '');

    const nameEl = document.createElement('div');
    nameEl.className = 'msg-name';
    nameEl.textContent = username;

    const bubble = document.createElement('div');
    bubble.className = 'msg';
    bubble.textContent = text;

    row.appendChild(nameEl);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    previewEl.textContent = '';
  });
</script>

</body>
</html>
