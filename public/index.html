<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Glimpse</title>

<!-- Add to Home Screen support -->
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0a0908">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Glimpse">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a0908;
    --surface: #141311;
    --surface-raised: #1b1a17;
    --border: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.18);
    --text: #f5f3ee;
    --muted: #8a8680;
    --accent: #d4ff4f;
    --accent-dim: rgba(212,255,79,0.12);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  body {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(28px + var(--safe-top)) 18px calc(28px + var(--safe-bottom));
  }

  .app { width: 100%; max-width: 420px; }

  /* ---- Wordmark ---- */
  .brand { display: flex; align-items: baseline; gap: 9px; margin-bottom: 6px; }
  .flash {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 32px;
    letter-spacing: -0.5px;
    margin: 0;
    color: var(--text);
  }
  .tagline {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 26px 0;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  .screen { padding: 26px 22px; text-align: left; }
  .screen p {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 16px 0;
  }
  .screen input {
    width: 100%; padding: 13px 14px; border-radius: 3px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 16px; font-family: 'Space Grotesk', sans-serif;
    margin-bottom: 12px; outline: none; transition: border-color 0.15s;
  }
  .screen input:focus { border-color: var(--accent); }
  .screen input::placeholder { color: var(--muted); }

  .primary-btn {
    width: 100%; padding: 13px; border-radius: 3px; border: 1px solid var(--accent);
    background: var(--accent);
    color: #0a0908; font-weight: 600; font-size: 14px; font-family: 'Space Grotesk', sans-serif;
    cursor: pointer; transition: opacity 0.15s;
  }
  .primary-btn:active { opacity: 0.8; }

  .divider {
    color: var(--muted); font-size: 11px; margin: 20px 0;
    display: flex; align-items: center; gap: 10px;
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  #linkBox {
    display: none;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 12px;
    font-size: 12px;
    font-family: monospace;
    color: var(--accent);
    word-break: break-all;
    margin-bottom: 10px;
  }
  .copy-btn {
    width: 100%; padding: 11px; border-radius: 3px;
    border: 1px solid var(--border-strong); background: transparent;
    color: var(--text); font-size: 13px; cursor: pointer; font-family: 'Space Grotesk', sans-serif; font-weight: 500;
    margin-bottom: 10px;
  }

  /* ---- Chat screen ---- */
  #chatScreen { display: none; }
  #status {
    font-size: 12px; color: var(--muted);
    display: flex; align-items: center; gap: 7px; margin: 0 0 10px 2px;
  }
  #status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  #status.waiting .dot { background: var(--muted); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  #expiry {
    font-size: 11px; color: var(--muted); margin: 0 0 14px 2px;
    font-family: monospace; letter-spacing: 0.2px;
  }

  #messages { height: min(52vh, 380px); overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border-strong); }

  .msg-row { display: flex; flex-direction: column; max-width: 82%; }
  .msg-row.mine { align-self: flex-end; align-items: flex-end; }
  .msg-name {
    font-size: 10px; color: var(--muted); margin-bottom: 4px; padding: 0 2px;
    text-transform: lowercase; letter-spacing: 0.3px;
  }
  .msg {
    padding: 10px 13px; background: var(--surface-raised); border: 1px solid var(--border);
    border-radius: 3px; line-height: 1.5; font-size: 14px; word-break: break-word;
  }
  .msg-row.mine .msg {
    background: var(--accent-dim);
    border: 1px solid rgba(212,255,79,0.3);
    color: var(--text);
  }

  #preview {
    min-height: 18px; color: var(--accent); font-size: 12.5px; margin: 10px 2px;
    font-family: monospace; opacity: 0.85;
  }

  #inputBar { margin-top: 14px; padding: 8px; display: flex; gap: 8px; }
  #textInput {
    flex: 1; padding: 12px 14px; border-radius: 3px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 16px; font-family: 'Space Grotesk', sans-serif;
    outline: none; transition: border-color 0.15s; min-width: 0;
  }
  #textInput:focus { border-color: var(--accent); }
  #sendBtn {
    padding: 0 20px; border-radius: 3px; border: 1px solid var(--accent);
    background: var(--accent); color: #0a0908; cursor: pointer;
    font-weight: 600; font-family: 'Space Grotesk', sans-serif; font-size: 13px; flex-shrink: 0;
  }
  #sendBtn:active { opacity: 0.8; }

  @media (max-width: 420px) {
    h1 { font-size: 27px; }
    .screen { padding: 20px 16px; }
    #messages { height: min(56vh, 420px); padding: 14px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="brand">
    <img class="flash" src="/icons/wordmark-eye.png" alt="">
    <h1>Glimpse</h1>
  </div>
  <div class="tagline">what almost got said</div>

  <div id="startScreen" class="panel screen">
    <p>Start a chat for up to 5 people, or join one with a link</p>
    <button id="createBtn" class="primary-btn">Start a new chat</button>
    <div id="linkBox"></div>
    <div id="qrWrap" style="display:none; text-align:center; margin-bottom:10px;">
      <div id="qrCodeTarget" style="display:inline-block; padding:10px; background:#fff; border-radius:3px;"></div>
      <div style="font-size:11px; color:var(--muted); margin-top:6px;">scan to join</div>
    </div>
    <button id="copyBtn" class="copy-btn" style="display:none;">Copy link</button>
    <button id="continueBtn" class="primary-btn" style="display:none;">Continue to chat</button>

    <div class="divider">or</div>

    <input id="roomCodeInput" placeholder="Paste a room code or link..." autocomplete="off">
    <button id="joinRoomBtn" class="primary-btn">Join chat</button>
  </div>

  <div id="joinScreen" class="panel screen" style="display:none;">
    <p>Enter a name to join the chat</p>
    <input id="usernameInput" placeholder="Your name..." autocomplete="off" maxlength="20">
    <button id="joinBtn" class="primary-btn">Join chat</button>
  </div>

  <div id="chatScreen">
    <div id="status" class="waiting"><span class="dot"></span><span id="statusText">Waiting for the other person to join...</span></div>
    <div id="expiry"></div>
    <div id="messages" class="panel"></div>
    <div id="preview"></div>
    <div id="inputBar" class="panel">
      <input id="textInput" placeholder="Type something..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const socket = io();
  let myUsername = '';
  let myRoom = '';

  const startScreen = document.getElementById('startScreen');
  const joinScreen = document.getElementById('joinScreen');
  const chatScreen = document.getElementById('chatScreen');

  const createBtn = document.getElementById('createBtn');
  const linkBox = document.getElementById('linkBox');
  const qrWrap = document.getElementById('qrWrap');
  const qrCodeTarget = document.getElementById('qrCodeTarget');
  const copyBtn = document.getElementById('copyBtn');
  const continueBtn = document.getElementById('continueBtn');
  const roomCodeInput = document.getElementById('roomCodeInput');
  const joinRoomBtn = document.getElementById('joinRoomBtn');

  const usernameInput = document.getElementById('usernameInput');
  const joinBtn = document.getElementById('joinBtn');

  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const expiryEl = document.getElementById('expiry');
  const messagesEl = document.getElementById('messages');
  const previewEl = document.getElementById('preview');
  const inputEl = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');

  function randomRoomCode() {
    return Math.random().toString(36).substring(2, 8);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function copyToClipboard(text) {
    function showCopied(success) {
      copyBtn.textContent = success ? 'Copied' : 'Select & copy the link above';
      setTimeout(() => { copyBtn.textContent = 'Copy link'; }, 2000);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => showCopied(true), () => fallbackCopy(text, showCopied));
    } else {
      fallbackCopy(text, showCopied);
    }
  }

  function fallbackCopy(text, callback) {
    const tempInput = document.createElement('textarea');
    tempInput.value = text;
    tempInput.style.position = 'fixed';
    tempInput.style.opacity = '0';
    document.body.appendChild(tempInput);
    tempInput.focus();
    tempInput.select();
    let success = false;
    try { success = document.execCommand('copy'); } catch (err) { success = false; }
    document.body.removeChild(tempInput);
    callback(success);
  }

  function goToUsernameScreen(room) {
    myRoom = room;
    startScreen.style.display = 'none';
    joinScreen.style.display = 'block';
    usernameInput.focus();
  }

  let pendingRoom = '';
  createBtn.addEventListener('click', () => {
    pendingRoom = randomRoomCode();
    const link = `${window.location.origin}/?room=${pendingRoom}`;
    history.replaceState(null, '', `/?room=${pendingRoom}`);
    linkBox.textContent = link;
    linkBox.style.display = 'block';
    linkBox.style.cursor = 'pointer';
    linkBox.title = 'Tap to select the link';
    linkBox.onclick = () => {
      const range = document.createRange();
      range.selectNodeContents(linkBox);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    };
    copyBtn.style.display = 'block';
    continueBtn.style.display = 'block';
    createBtn.style.display = 'none';
    copyBtn.onclick = () => copyToClipboard(link);

    // Show a scannable QR code for the same link
    if (window.QRCode) {
      qrCodeTarget.innerHTML = '';
      new QRCode(qrCodeTarget, {
        text: link,
        width: 140,
        height: 140,
        colorDark: '#0a0908',
        colorLight: '#ffffff',
      });
      qrWrap.style.display = 'block';
    }
  });

  continueBtn.addEventListener('click', () => goToUsernameScreen(pendingRoom));

  joinRoomBtn.addEventListener('click', () => {
    let value = roomCodeInput.value.trim();
    if (!value) return;
    const match = value.match(/room=([a-zA-Z0-9]+)/);
    const room = match ? match[1] : value;
    history.replaceState(null, '', `/?room=${room}`);

    const savedName = localStorage.getItem('glimpse-name-' + room);
    if (savedName) {
      enterChat(room, savedName);
    } else {
      goToUsernameScreen(room);
    }
  });

  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const room = params.get('room');
    if (!room) return;

    // If this browser already has a saved name for this exact room,
    // skip straight into the chat instead of asking again.
    const savedName = localStorage.getItem('glimpse-name-' + room);
    if (savedName) {
      enterChat(room, savedName);
    } else {
      goToUsernameScreen(room);
    }
  });

  function enterChat(room, username) {
    myRoom = room;
    myUsername = username;
    localStorage.setItem('glimpse-name-' + room, username);
    socket.emit('join', { room, username });
    startScreen.style.display = 'none';
    joinScreen.style.display = 'none';
    chatScreen.style.display = 'block';
    inputEl.focus();
  }

  function join() {
    const name = usernameInput.value.trim();
    if (!name || !myRoom) return;
    enterChat(myRoom, name);
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  }

  // --- Alerts for messages that arrive while the tab isn't in focus ---
  const originalTitle = document.title;
  let titleFlashTimer = null;

  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = 720;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } catch (err) { /* audio not available — fail silently */ }
  }

  function flashTitle() {
    if (titleFlashTimer) return;
    let showingAlert = true;
    titleFlashTimer = setInterval(() => {
      document.title = showingAlert ? '💬 New message' : originalTitle;
      showingAlert = !showingAlert;
    }, 1000);
  }

  function stopFlashingTitle() {
    if (titleFlashTimer) {
      clearInterval(titleFlashTimer);
      titleFlashTimer = null;
    }
    document.title = originalTitle;
  }

  window.addEventListener('focus', stopFlashingTitle);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) stopFlashingTitle();
  });

  function notifyIncomingMessage(username, text) {
    if (document.hidden) {
      playBeep();
      flashTitle();
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(`${username} — Glimpse`, { body: text });
      }
    }
  }

  joinBtn.addEventListener('click', join);
  usernameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') join(); });

  // Live 24-hour countdown, shown in the chat header
  let countdownTimer = null;
  socket.on('roomStartTime', (startTime) => {
    const expiresAt = startTime + 24 * 60 * 60 * 1000;

    function updateCountdown() {
      const remainingMs = expiresAt - Date.now();
      if (remainingMs <= 0) {
        expiryEl.textContent = 'this chat has expired';
        clearInterval(countdownTimer);
        return;
      }
      const hours = Math.floor(remainingMs / (1000 * 60 * 60));
      const minutes = Math.floor((remainingMs % (1000 * 60 * 60)) / (1000 * 60));
      expiryEl.textContent = `clears in ${hours}h ${minutes}m`;
    }

    updateCountdown();
    if (countdownTimer) clearInterval(countdownTimer);
    countdownTimer = setInterval(updateCountdown, 60 * 1000); // update every minute
  });

  socket.on('roomFull', (maxSize) => {
    joinScreen.querySelector('p').textContent = `this chat is full (max ${maxSize} people) — ask for a new link`;
    joinBtn.style.display = 'none';
  });

  socket.on('userList', (list) => {
    const others = list.filter(n => n !== myUsername);
    if (list.length >= 2) {
      statusEl.classList.remove('waiting');
      statusText.textContent = `you, ${others.join(', ')}`;
    } else {
      statusEl.classList.add('waiting');
      statusText.textContent = 'waiting for others to join...';
    }
  });

  inputEl.addEventListener('input', () => { socket.emit('typing', inputEl.value); });

  // Track each person's live typing text separately, so in a group
  // chat, multiple people typing at once don't overwrite each other.
  const typingUsers = {};
  socket.on('partnerTyping', ({ username, text }) => {
    if (text) {
      typingUsers[username] = text;
    } else {
      delete typingUsers[username];
    }
    const names = Object.keys(typingUsers);
    if (names.length === 0) {
      previewEl.innerHTML = '';
    } else {
      previewEl.innerHTML = names
        .map(name => `<div>${escapeHtml(name)} is typing: "${escapeHtml(typingUsers[name])}"</div>`)
        .join('');
    }
  });

  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    socket.emit('sendMessage', text);
    socket.emit('typing', '');
    inputEl.value = '';
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

  function renderMessage({ username, text }) {
    const row = document.createElement('div');
    row.className = 'msg-row' + (username === myUsername ? ' mine' : '');
    const nameEl = document.createElement('div');
    nameEl.className = 'msg-name';
    nameEl.textContent = username;
    const bubble = document.createElement('div');
    bubble.className = 'msg';
    bubble.textContent = text;
    row.appendChild(nameEl);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
  }

  socket.on('newMessage', (msg) => {
    renderMessage(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    previewEl.innerHTML = '';
    if (msg.username !== myUsername) {
      notifyIncomingMessage(msg.username, msg.text);
    }
  });

  // Past messages from the last 24 hours, sent once when you join a room
  socket.on('chatHistory', (messages) => {
    messages.forEach(renderMessage);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });
</script>

</body>
</html>
